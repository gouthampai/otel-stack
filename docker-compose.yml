services:
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d' # Keep only 7 days of data to save disk space
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-remote-write-receiver' # Required for the collector's prometheusremotewrite exporter
    restart: unless-stopped
    mem_limit: 2048M
    cpus: "1.0"

  loki:
    image: grafana/loki:3.5.3 # 3.x required for native OTLP ingestion from the collector
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki:/etc/loki
      - loki-data:/loki
    command: '-config.file=/etc/loki/loki-config.yaml'
    restart: unless-stopped
    mem_limit: 1024M
    cpus: "0.5"

  tempo:
    image: grafana/tempo:2.8.0
    container_name: tempo
    ports:
      - "3200:3200" # Tempo HTTP (for Grafana)
    volumes:
      - ./config/tempo:/etc/tempo
      - tempo-data:/var/tempo
    command: '-config.file=/etc/tempo/tempo-config.yaml'
    restart: unless-stopped
    mem_limit: 1024M # Headroom for the metrics-generator
    cpus: "0.5"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    mem_limit: 512M
    cpus: "0.5"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    container_name: otel-collector
    ports:
      - "4318:4318" # OTLP HTTP (Receiver)
      - "4317:4317" # OTLP gRPC (Receiver)
    volumes:
      - ./config/otel-collector:/etc/otel
    command: '--config=/etc/otel/otel-collector-config.yaml'
    restart: unless-stopped
    mem_limit: 512M
    cpus: "0.5"

volumes:
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local
  grafana-data:
    driver: local

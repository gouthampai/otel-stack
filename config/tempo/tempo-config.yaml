server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal # Keep the WAL inside the tempo-data volume
    local:
      path: /tmp/tempo/traces
